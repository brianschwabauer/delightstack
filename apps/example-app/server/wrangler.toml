#:schema node_modules/wrangler/config-schema.json
name = "foreverfamily-server"
main = "src/index.ts"
compatibility_date = "2025-05-08"
account_id = "92cb4bb9b2a55d24f5688f2f61864079"
workers_dev = false

[observability]
enabled = true

# Durable Object migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = [
	"AuthDatabaseServer",
	"OrgDatabaseServer",
	"AppWebsocketServer",
	"RateLimiterServer",
	"ImageProcessorContainer",
]

[ai]
binding = "AI"

# Durable Objects
[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthDatabaseServer"

[[durable_objects.bindings]]
name = "DB"
class_name = "OrgDatabaseServer"

[[durable_objects.bindings]]
name = "WS"
class_name = "AppWebsocketServer"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterServer"

[[durable_objects.bindings]]
name = "IMAGE_PROCESSOR"
class_name = "ImageProcessorContainer"

# Image processing container — Bun + Sharp/libvips for variant generation,
# thumbhash, EXIF, color extraction, face-aware cropping.
[[containers]]
class_name = "ImageProcessorContainer"
image = "../../../packages/images/container/Dockerfile"
max_instances = 5
instance_type = "lite"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "86eb734b0be94ef6bd522185e1ef9e42"

# R2 Storage Buckets
[[r2_buckets]]
binding = "R2"
bucket_name = "foreverfamily"


# -------------------------------------------------------------------------------------------------
# -------------------------------------- STAGING ENVIRONMENT --------------------------------------
# -------------------------------------------------------------------------------------------------
[env.staging]
name = "foreverfamily-server-staging"

[env.staging.ai]
binding = "AI"

# Durable Objects
[[env.staging.durable_objects.bindings]]
name = "AUTH"
class_name = "AuthDatabaseServer"

[[env.staging.durable_objects.bindings]]
name = "DB"
class_name = "OrgDatabaseServer"

[[env.staging.durable_objects.bindings]]
name = "WS"
class_name = "AppWebsocketServer"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterServer"

[[env.staging.durable_objects.bindings]]
name = "IMAGE_PROCESSOR"
class_name = "ImageProcessorContainer"

[[env.staging.containers]]
class_name = "ImageProcessorContainer"
image = "../../../packages/images/container/Dockerfile"
max_instances = 5
instance_type = "standard-1"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "foreverfamily-server-staging"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "19098fe743e642bc825b946e11d30a7c"
